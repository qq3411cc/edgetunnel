name: 拉取 cmliu 最新 _worker.js 并修补测速逻辑

on:
  workflow_dispatch: # 在 GitHub Actions 页面手动点击触发

jobs:
  patch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 下载 cmliu 仓库最新 _worker.js
        run: |
          curl -sSL https://raw.githubusercontent.com/cmliu/edgetunnel/main/_worker.js -o _worker.js

      - name: 强制修补 _worker.js
        run: |
          python3 -c "
          import re

          with open('_worker.js', 'r', encoding='utf-8') as f:
              content = f.read()

          # 1. 替换所有调用处的参数传入：isSpeedTestSite(hostname) -> isSpeedTestSite(hostname, port)
          content = re.sub(r'\bisSpeedTestSite\(\s*hostname\s*\)', 'isSpeedTestSite(hostname, port)', content)

          # 2. 匹配并直接覆盖整个 isSpeedTestSite 函数体，确保包含 80 端口校验
          func_pattern = r'function\s+isSpeedTestSite\s*\([^)]*\)\s*\{[\s\S]*?\}'
          func_replace = (
              'function isSpeedTestSite(hostname, port) {\n'
              ' if (port != 80 || !hostname) return false;\n'
              ' const speedTestDomains = [\'speed.cloudflare.com\', \'cp.cloudflare.com\'];\n'
              ' hostname = hostname.toLowerCase();\n'
              ' return speedTestDomains.some(domain => hostname === domain || hostname.endsWith(\'.\' + domain));\n'
              '}'
          )

          content = re.sub(func_pattern, func_replace, content)

          with open('_worker.js', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: 保存修改并推送回仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -n "$(git status --porcelain)" ]; then
            git add _worker.js
            git commit -m "sync: 同步 cmliu 最新 _worker.js 并修复 80 端口测速拦截逻辑 [skip ci]"
            git push
            echo "修改完成，已成功推送到仓库！"
          else
            echo "代码与 cmliu 最新版本一致且已成功打补丁，无需重复提交。"
          fi
